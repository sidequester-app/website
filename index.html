<style>
:root {
  --bg: #FFFCF7;
  --card: #FFFFFF;
  --ink: #241410;
  --muted: #6E625D;
  --line: #E9E5E0;

  --coral-1: #F4402C;
  --coral-2: #F4402C;
  --coral: #D63220;
  --coral-bg: #FEE9E3;

  --violet: #241410;
  --violet-bg: #F4F0EB;
  --mint: #8ADCE4;

  --r-card: 24px;
  --r-img: 18px;
  --shadow: 0 0 0 1px #E9E5E0;

  /* ---------- Masse, die mit dem Bildschirm mitwachsen ----------
     Alle Werte interpolieren linear zwischen 375px (iPhone) und
     1280px (Laptop) Viewportbreite und frieren dann ein.
     Formel: clamp(min, achsenabschnitt + steigung*vw, max)

     Die Lesespalte ist in em angegeben, damit die Zeichen pro Zeile
     gleich bleiben, wenn die Schrift mitwächst (Bringhurst: 45–75,
     Optimum ~66). Breiter werden nur die Teile, die keine Textwand
     sind: der Quest-Slider und die Anleitung.                     */
  --pad:       clamp(18px, 14.2px + 1.02vw, 32px);
  --text-max:  34em;     /* Lesespalte: ~68 Zeichen (Bringhurst: Optimum 66) */
  --breit-max: 1040px;   /* Ausbrecher: Slider, Anleitung */

  --luft:      clamp(52px, 37.1px + 3.98vw, 88px);   /* zwischen Themen */
  --luft-kopf: clamp(76px, 54.3px + 5.8vw, 128px);   /* nach dem Kopf */

  --fs-body:  clamp(18px, 17.2px + 0.22vw, 20px);
  --fs-h1:    clamp(42px, 26.67px + 4.79vw, 88px);   /* Reserve, damit SIDEQUESTER überall einzeilig bleibt */
  --fs-tag:   clamp(21px, 17.3px + 0.99vw, 30px);
  --fs-lead:  clamp(18px, 16.8px + 0.33vw, 21px);
  --fs-titel: clamp(27px, 21.2px + 1.55vw, 41px);
  --fs-quest: clamp(20px, 18.8px + 0.33vw, 23px);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  font-size: var(--fs-body);
  /* kurze Zeilen brauchen weniger Zeilenabstand als lange */
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  padding-top: env(safe-area-inset-top, 0px);
}

.wrap { max-width: var(--text-max); margin: 0 auto; padding: 0 var(--pad); }
p { margin: 0; }
img { max-width: 100%; display: block; }
a { color: inherit; }

/* Luft zwischen den Themen */
.stack > * + * { margin-top: var(--luft); }
/* und am Schluss, damit die Anleitung nicht am Rand klebt */
.stack { padding-bottom: calc(var(--luft) + env(safe-area-inset-bottom, 0px)); }
.stack > header + * { margin-top: var(--luft-kopf); }  /* nach "Und machen." beginnt sichtbar Neues */

@media (min-width: 64rem) { body { line-height: 1.6; } }

/* Ueberschriften gleichmaessig umbrechen, keine einzelnen Woerter am Zeilenende */
h1, h2, h3, .tagline { text-wrap: balance; }
p { text-wrap: pretty; }

/* Ausbrecher: darf breiter sein als die Lesespalte, bleibt zentriert */
.breit {
  --b: min(var(--breit-max), calc(100vw - 2 * var(--pad)));
  width: var(--b);
  margin-left: calc(50% - var(--b) / 2);
}

.card {
  background: var(--card);
  border-radius: var(--r-card);
  box-shadow: var(--shadow);
  padding: clamp(18px, 14.7px + 0.88vw, 30px);
}

.pill {
  display: inline-flex; align-items: center; gap: 6px;
  border-radius: 999px;
  padding: 6px 13px;
  font-size: 13px; font-weight: 600;
  letter-spacing: -0.01em;
  white-space: nowrap;
}
.pill-violet { background: var(--violet-bg); color: var(--violet); }
.pill-mint   { background: var(--mint); color: #241410; }
.pill-grey   { background: #F4F0EB; color: #6E625D; }

/* Abschnitt: fette Überschrift, darunter ein normaler Satz */
.section-title {
  font-size: var(--fs-titel);
  font-weight: 700;
  color: var(--ink);
  letter-spacing: -0.03em;
  line-height: 1.12;
  margin: 0 0 7px;
}
.section-lead {
  font-size: var(--fs-lead);
  font-weight: 400;
  color: #6E625D;
  letter-spacing: -0.005em;
  line-height: 1.5;
  max-width: 44ch;
  margin: 0 0 20px;
}
.section-title + .founders,
.section-title + .slider { margin-top: 18px; }

/* ---------- Kopf ---------- */
header { padding-top: clamp(44px, 26.5px + 5.75vw, 104px); }

h1 {
  font-size: var(--fs-h1);
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: -0.045em;   /* Versalien laufen sonst auseinander */
  line-height: .95;
  margin: 14px 0 8px;
}

.tagline {
  font-size: var(--fs-tag); font-weight: 600;
  letter-spacing: -0.02em;
  line-height: 1.2;
  color: var(--coral);
  margin-bottom: 14px;
}

.idea {
  color: #6E625D;
  font-size: var(--fs-lead);
  line-height: 1.55;
  letter-spacing: -0.005em;
  max-width: 40ch;
}

/* ---------- Quest-Slider ---------- */
.slider {
  display: flex;
  gap: 14px;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  /* über die Container-Ränder hinaus, damit die nächste Karte anschneidet */
  margin: 0 calc(var(--pad) * -1);
  padding: 4px var(--pad) 14px;
  /* an beiden Seiten weich auslaufen, damit die angeschnittene Karte
     nicht wie abgeschnitten wirkt */
  -webkit-mask-image: linear-gradient(to right, transparent 0,
      #000 calc(var(--pad) * .9), #000 calc(100% - var(--pad) * .9), transparent 100%);
          mask-image: linear-gradient(to right, transparent 0,
      #000 calc(var(--pad) * .9), #000 calc(100% - var(--pad) * .9), transparent 100%);
}
.slider::-webkit-scrollbar { display: none; }

/* Positionsanzeige: macht sichtbar, dass der Streifen weitergeht */
.slider-dots {
  display: flex; justify-content: center; gap: 6px;
  flex-wrap: wrap;          /* bricht um, falls sehr viele Quests dazukommen */
  margin-top: 4px;
}
.slider-dots i {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #E9E5E0;
  transition: background .25s ease-out, transform .25s ease-out;
}
.slider-dots i.on { background: var(--coral); transform: scale(1.25); }


.slider .quest {
  flex: 0 0 78%;
  scroll-snap-align: center;
  display: flex;
  flex-direction: column;
}
/* mehr Platz -> mehr Karten gleichzeitig sichtbar */
@media (min-width: 560px) { .slider .quest { flex-basis: 62%; } }

.quest-top {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px;
  margin-bottom: 12px;
  min-height: 30px;
}
.quest h3 {
  font-size: var(--fs-quest); font-weight: 700;
  letter-spacing: -0.025em;
  line-height: 1.2;
  margin: 0 0 7px;
}
.quest p { color: #6E625D; font-size: 16px; line-height: 1.5; margin-bottom: 14px; }

/* wer die Quest erstellt hat — das Handle zeigt, dass sie echt ist */
.quest .von {
  display: flex; align-items: center; gap: 7px;
  margin-top: auto;          /* nach unten schieben: Linie überall gleich hoch */
  padding-top: 14px;
  border-top: 1px solid var(--line);
  font-size: 14px; color: var(--muted);
}
.quest .von i {
  width: 22px; height: 22px; flex: none;
  border-radius: 50%;
  background: var(--violet-bg); color: var(--violet);
  font-style: normal; font-weight: 700; font-size: 11px;
  display: grid; place-items: center;
}
.quest .von b { color: #241410; font-weight: 600; }

/* ---------- Wer sind wir ----------
   Alle Porträts liegen im Format 3:4 vor (siehe fotos-optimieren.command).
   Deshalb stehen Spaltenbreite und Bildformat fest im CSS — dann sind die
   Bilder immer exakt gleich gross, egal wann sie geladen sind. Ein Foto
   mit abweichendem Format wird mittig eingepasst statt das Raster zu kippen. */
/* Vier Personen.
   Handy: Karussell. Die Karte in der Mitte ist ganz zu sehen, links und
   rechts schaut je eine halbe heraus. Beim Start steht Maël in der Mitte,
   gewischt wird endlos im Kreis (die Karten liegen dafür dreifach da,
   die Kopien sind am Computer ausgeblendet).
   Tablet: zwei mal zwei. Computer: vier Karten nebeneinander. */
.founders {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  /* Bis an den Bildschirmrand, damit die halben Karten wirklich am Rand
     angeschnitten sind und nicht an der Textspalte. */
  margin-left: calc(-1 * var(--pad));
  margin-right: calc(-1 * var(--pad));
  padding: 6px 0 18px;
}
.founders::-webkit-scrollbar { display: none; }
.founders figure {
  flex: 0 0 50%;
  margin: 0;
  scroll-snap-align: center;
  display: flex;
  flex-direction: column;
  /* Die Karten am Rand treten zurück, die mittlere ist im Fokus. */
  opacity: .55;
  transform: scale(.92);
  transition: opacity .25s ease-out, transform .25s ease-out;
}
.founders figure.mitte { opacity: 1; transform: none; }
.founders figure figcaption { flex: 1; margin: 12px 2px 0 !important; }
.founders figure .insta { align-self: flex-start; }

@media (min-width: 560px) {
  .founders {
    /* Etwas breiter als die Textspalte, sonst werden die Fotos zu klein. */
    --b: min(640px, calc(100vw - 2 * var(--pad)));
    width: var(--b);
    margin-left: calc(50% - var(--b) / 2);
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
    align-items: stretch;
  }
  .founders { overflow: visible; margin-right: 0; padding: 0; }
  .founders figure { opacity: 1; transform: none; }
  .founders figure.kopie { display: none; }
  /* Knöpfe unten bündig, egal wie lang die Rolle ist. */
  .founders figure figcaption { margin: 14px 2px 0 !important; }
}
@media (min-width: 900px) {
  .founders {
    --b: min(1080px, calc(100vw - 2 * var(--pad)));
    grid-template-columns: repeat(4, 1fr);
  }
}
.founders .pic {
  position: relative;
  aspect-ratio: 3 / 4;
  border-radius: var(--r-img);
  overflow: hidden;
  box-shadow: var(--shadow);
  background: #E7E7EC;
  line-height: 0;
}
.founders img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: opacity .19s ease-out, transform .19s ease-out;
}
/* kein Bild im Ordner gefunden */
.founders .pic.leer { aspect-ratio: 3 / 4; }
.founders .pic.leer::after {
  content: "Foto in img/ legen";
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  text-align: center; padding: 10px;
  font-size: 13px; line-height: 1.3; color: #857A75;
}
/* Foto mit mehreren Bildern: antippbar */
.founders .multi .pic { cursor: pointer; -webkit-tap-highlight-color: transparent; }
.founders .pic.wechselt img { opacity: .45; transform: scale(.988); }

.dots {
  position: absolute;
  left: 0; right: 0; bottom: 9px;
  display: flex; justify-content: center; gap: 5px;
  pointer-events: none;
}
.dots i {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: rgba(255,255,255,.45);
  box-shadow: 0 0 3px rgba(0,0,0,.45);
  transition: background .19s ease-out;
}
.dots i.on { background: #fff; }
.founders figcaption {
  /* Name oben, Rolle darunter – bei beiden gleich, egal wie lang die
     Rolle ist. Vorher brach nur die längere um und die Karten sahen
     unterschiedlich aus. */
  display: flex;
  flex-direction: column;
  margin: 14px 2px 0;
  font-size: 16px;
  line-height: 1.4;
  color: var(--muted);
  letter-spacing: -0.012em;
}
.founders figcaption b {
  color: var(--ink);
  font-weight: 700;
  letter-spacing: -0.02em;
}

/* Instagram unter dem Namen: kleine Pille im Stil der Seite */
.founders .insta {
  display: inline-flex; align-items: center; gap: 7px;
  align-self: flex-start;
  margin: 12px 2px 0;
  padding: 8px 14px 8px 12px;
  border-radius: 999px;
  background: var(--card);
  box-shadow: var(--shadow);
  color: var(--ink);
  font-size: 14px; font-weight: 600; letter-spacing: -0.01em;
  text-decoration: none;
  transition: transform .12s ease-out, color .12s ease-out;
}
.founders .insta svg { color: var(--coral); flex: none; }
/* Nur mit Maus: Auf dem Handy bliebe die Farbe nach dem Antippen
   hängen, und die zwei Knöpfe sähen verschieden aus. */
@media (hover: hover) {
  .founders .insta:hover { color: var(--coral); }
}
.founders .insta:active { transform: scale(.97); }

/* ---------- Der Knopf ---------- */
.cta { margin: 72px 0; text-align: center; }

/* Zweite Zeile unter dem Knopf: der Weg in die Webversion.
   display steht hier auf block, sonst setzt es das hidden-Attribut
   ausser Kraft und die Zeile stuende da, bevor es die App gibt.
   Die hidden-Regel ist genauer und gewinnt trotzdem. */
.webLink[hidden] { display: none; }
.webLink {
  display: block; width: fit-content; margin: 18px auto 0;
  font-size: 15px; font-weight: 600; letter-spacing: -0.01em;
  color: var(--muted); text-decoration: none;
  border-bottom: 1px solid rgba(0,0,0,0.12); padding-bottom: 2px;
}
.webLink:hover { color: var(--ink); }

.bigbtn {
  display: inline-block;
  position: relative;
  overflow: hidden;
  text-decoration: none;
  color: #241410;
  background: var(--coral-1);
  max-width: 100%;
  border-radius: 28px;
  padding: 15px 28px 17px;
  letter-spacing: -0.015em;
  box-shadow: none;
  /* Startzustand fürs Reinziehen */
  opacity: 0;
  transform: translateY(14px) scale(.94);
  transition:
    opacity .5s cubic-bezier(.22,.61,.36,1),
    transform .55s cubic-bezier(.22,.61,.36,1),
    box-shadow .12s ease-out;
}
.bigbtn.in { opacity: 1; transform: translateY(0) scale(1); }
.bigbtn:active {
  transform: scale(.97);
  box-shadow: none;
  transition: transform .1s ease-out, box-shadow .1s ease-out;
}

/* edler Lichtreflex, der langsam durchzieht */
.bigbtn::after {
  content: "";
  position: absolute;
  top: 0; bottom: 0;
  left: -60%;
  width: 45%;
  background: linear-gradient(100deg,
    rgba(255,255,255,0) 0%,
    rgba(255,255,255,.38) 50%,
    rgba(255,255,255,0) 100%);
  transform: skewX(-18deg);
  pointer-events: none;
}
.bigbtn.in::after { animation: sheen 4.6s ease-in-out 1.1s infinite; }
@keyframes sheen {
  0%   { left: -60%; }
  38%  { left: 130%; }
  100% { left: 130%; }
}

.bigbtn .b1 {
  display: block;
  font-size: 19px;
  font-weight: 700;
  line-height: 1.2;
}
.bigbtn .b2 {
  display: block;
  font-size: 13.5px;
  font-weight: 500;
  line-height: 1.3;
  margin-top: 3px;
  color: rgba(255,255,255,.9);
}

/* ---------- Anleitung ---------- */
.guide-intro { color: var(--muted); font-size: 15px; margin-bottom: 20px; }
/* Rechtliches ganz unten, klein und ruhig. */
.fuss {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 18px;
  margin: 40px 0 calc(28px + env(safe-area-inset-bottom));
  font-size: 13px;
}
.fuss a { color: var(--muted); text-decoration: none; }
.fuss a:hover { color: var(--coral); }

.step { display: grid; grid-template-columns: 28px 1fr; gap: 12px; }
.step + .step { margin-top: 22px; padding-top: 22px; border-top: 1px solid var(--line); }
.step-no {
  width: 28px; height: 28px;
  border-radius: 50%;

  const zweit = document.getElementById("webLink");

  // Ist die App im Store, führt der grosse Knopf dorthin und die
  // Webversion rutscht in die kleine Zeile darunter. Ohne Store-Link
  // bleibt alles wie bisher.
  if (!isPh(CONFIG.appStoreUrl)) {
    knopf.href = CONFIG.appStoreUrl;
    if (!isPh(CONFIG.appUrl)) {
      zweit.href = CONFIG.appUrl;
      zweit.hidden = false;
    }
  } else {
    knopf.href = isPh(CONFIG.appUrl) ? "#" : CONFIG.appUrl;
    if (isPh(CONFIG.appUrl)) console.warn("Sidequester: appUrl fehlt — der Knopf führt nirgendwohin.");
  }

  /* ---------- Quests: endlos, immer nach rechts ----------
     Die Karten stehen zweimal hintereinander. Sobald die zweite
     Runde beginnt, springt die Position unsichtbar eine Runde
     zurück — dadurch läuft es endlos, ohne je rückwärts zu gehen. */
  const slider = document.getElementById("slider");
  const karteHtml = q =>
    '<article class="card quest">' +
      '<div class="quest-top">' +
        (q.mood ? '<span class="pill pill-violet">&#9733; ' + esc(q.mood) + "</span>" : "<span></span>") +
        '<span class="pill pill-mint">' + esc(q.xp) + "</span>" +
      "</div>" +
      "<h3>" + esc(q.title) + "</h3>" +
      (q.text ? "<p>" + esc(q.text) + "</p>" : "") +
      (q.von ? '<div class="von"><i aria-hidden="true">' +
               esc(q.von.replace(/^@/, "")[0].toUpperCase()) +
               "</i><span>erstellt von <b>" + esc(q.von) + "</b></span></div>" : "") +
    "</article>";

  const endlos = CONFIG.quests.length > 1;
  const eineRunde = CONFIG.quests.map(karteHtml).join("");
  /* Drei Runden hintereinander: gestartet wird in der mittleren. Dadurch
     ist immer links die vorige und rechts die nächste Karte angeschnitten,
     und es gibt weder einen Anfang noch ein Ende. */
  slider.innerHTML = endlos ? eineRunde.repeat(3) : eineRunde;

  /* Positionspunkte unter dem Streifen */
  const sliderDots = document.getElementById("sliderDots");
  if (endlos) {
    sliderDots.innerHTML = CONFIG.quests
      .map((_, i) => '<i class="' + (i === 0 ? "on" : "") + '"></i>').join("");
    const punkte = [...sliderDots.querySelectorAll("i")];
    /* Nicht aus der Scrollposition rechnen — die springt beim Umlauf und
       die Rechnung driftet. Stattdessen direkt messen, welche Karte der
       Mitte am nächsten liegt. */
    const punkteSetzen = () => {
      const karten = slider.querySelectorAll(".quest");
      if (!karten.length) return;
      const mitte = slider.getBoundingClientRect().left + slider.clientWidth / 2;
      let beste = 0, kleinster = Infinity;
      karten.forEach((c, i) => {
        const b = c.getBoundingClientRect();
        const abstand = Math.abs((b.left + b.right) / 2 - mitte);
        if (abstand < kleinster) { kleinster = abstand; beste = i; }
      });
      const idx = beste % CONFIG.quests.length;
      punkte.forEach((d, n) => d.classList.toggle("on", n === idx));
    };

    /* direkt aufrufen statt über requestAnimationFrame: das pausiert,
       sobald die Seite nicht sichtbar gerendert wird. Die Messung ist
       billig genug. */
    slider.addEventListener("scroll", punkteSetzen, { passive: true });

    /* exakt eine Runde = alle Karten plus ihre Abstände. Nicht scrollWidth/2
       nehmen, das enthält den Innenabstand und der Sprung würde ruckeln. */
    const rundeBreite = () => {
      const k = slider.querySelector(".quest");
      return k ? (k.offsetWidth + 14) * CONFIG.quests.length : 0;
    };

    /* Die Position wird immer in der mittleren Runde gehalten. Läuft sie
       vorne oder hinten heraus, springt sie unsichtbar eine Runde zurück
       bzw. vor — der Inhalt ist identisch, man sieht den Sprung nicht. */
    const inDieMitte = () => {
      const runde = rundeBreite();
      if (runde <= 0) return;
      if (slider.scrollLeft >= runde * 2) slider.scrollLeft -= runde;
      else if (slider.scrollLeft < runde) slider.scrollLeft += runde;
    };

    let ruhePause;
    slider.addEventListener("scroll", () => {
      clearTimeout(ruhePause);
      /* Nach dem Stillstand: Position zurückholen und die Punkte noch
         einmal messen. Scroll-Snap rastet erst danach endgültig ein. */
      ruhePause = setTimeout(() => { inDieMitte(); punkteSetzen(); }, 140);
    }, { passive: true });

    /* Startposition: erste Karte der mittleren Runde, mittig im Bild */
    const zentrieren = () => {
      const karten = slider.querySelectorAll(".quest");
      const k = karten[CONFIG.quests.length];
      if (!k) return;
      slider.scrollLeft = k.offsetLeft - (slider.clientWidth - k.offsetWidth) / 2;
      punkteSetzen();
    };
    zentrieren();
    window.addEventListener("resize", zentrieren);

    /* von selbst weiterwischen, bis jemand selbst anfasst */
    if (!ruhig) {
      let timer = null, sichtbar = false;

      const weiter = () => {
        if (!sichtbar || document.hidden) return;
        /* passt alles ins Bild? dann gibt es nichts weiterzuschieben */
        if (slider.scrollWidth - slider.clientWidth < 8) return;
        const karte = slider.querySelector(".quest");
        if (!karte) return;
        inDieMitte();
        slider.scrollBy({ left: karte.offsetWidth + 14, behavior: "smooth" });
      };

      const start = () => { if (!timer) timer = setInterval(weiter, 3800); };
      const stop  = () => { clearInterval(timer); timer = null; };

      ["pointerdown", "touchstart", "wheel", "keydown"].forEach(ev =>
        slider.addEventListener(ev, stop, { passive: true, once: true }));

      if (window.IntersectionObserver) {
        new IntersectionObserver(([e]) => {
          sichtbar = e.isIntersecting;
          sichtbar ? start() : stop();
        }, { threshold: .3 }).observe(slider);
      } else {
        sichtbar = true; start();
      }
    }
  }

  /* ---------- Fotos: selbst im Ordner suchen ----------
     Probiert img/<kürzel>-1, -2, -3 … und hört beim ersten Loch auf.
     Geprüft wird per HEAD-Anfrage (lädt das Bild nicht mit); wo das
     nicht geht (z.B. direkt aus dem Dateisystem geöffnet), fällt es
     auf einen normalen Ladeversuch zurück.                          */
  /* Jede Endung, die hier steht, kostet am Ende der Suche eine
     erfolglose Anfrage (sichtbar als 404 in der Browser-Konsole —
     harmlos, das ist der Preis fürs Selberfinden). Darum nur die,
     die vom iPhone und aus dem Skript wirklich kommen. */
  const ENDUNGEN = ["jpg", "JPG", "jpeg", "png", "webp"];
  const MAX_BILDER = 40;
  let headGeht = true;

  async function gibtEs(url) {
    if (headGeht) {
      try {
        /* no-store, nicht force-cache: sonst gilt ein einmal gefundenes Bild
           auch dann noch als vorhanden, wenn die Datei längst gelöscht ist.
           Zusätzlich den Content-Type prüfen: liefert der Server für fehlende
           Pfade eine HTML-Seite mit Status 200 (SPA-Fallback), wäre die Suche
           sonst nicht zu stoppen. */
        const r = await fetch(url, { method: "HEAD", cache: "no-store" });
        return r.ok && (r.headers.get("content-type") || "").startsWith("image/");
      } catch (e) { headGeht = false; }
    }
    return new Promise(res => {
      const p = new Image();
      p.onload = () => res(true);
      p.onerror = () => res(false);
      p.src = url;
    });
  }

  async function findeBild(kuerzel, n) {
    for (const ext of ENDUNGEN) {
      const url = "/home/img/" + kuerzel + "-" + n + "." + ext;
      if (await gibtEs(url)) return url;
    }
    return null;
  }

  async function findeAlle(kuerzel) {
    const liste = [];
    for (let n = 1; n <= MAX_BILDER; n++) {
      const url = await findeBild(kuerzel, n);
      if (!url) break;
      liste.push(url);
    }
    return liste;
  }

  /* ---------- Die zwei ---------- */
  const INSTA_ICON =
    '<svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">' +
      '<rect x="3" y="3" width="18" height="18" rx="5.5"/>' +
      '<circle cx="12" cy="12" r="4.2"/>' +
      '<circle cx="17.4" cy="6.6" r="0.9" fill="currentColor" stroke="none"/>' +
    "</svg>";
  const box = document.getElementById("founders");
  /* Dreifach anlegen: [Kopie][echt][Kopie] – so lässt sich auf dem Handy
     endlos im Kreis wischen. Am Computer blendet CSS die Kopien aus. */
  const karte = (f, kopie) =>
    '<figure data-kuerzel="' + esc(f.bilder) + '"' + (kopie ? ' class="kopie" aria-hidden="true"' : '') + '>' +
      '<div class="pic">' +
        /* Das erste Bild direkt laden, parallel zur Suche — sonst steht
           hier eine halbe Sekunde lang eine leere Fläche. alt bleibt vorerst
           leer: ein alt-Text ohne Quelle zeigt das Kaputt-Symbol. */
        '<img src="/home/img/' + esc(f.bilder) + '-1.jpg" alt="" ' +
             'onerror="this.removeAttribute(\'src\')">' +
        '<span class="dots"></span>' +
      "</div>" +
      "<figcaption><b>" + esc(f.name) + "</b><span>" + esc(f.role) + "</span></figcaption>" +
      (f.insta
        ? '<a class="insta" href="https://www.instagram.com/' + esc(f.insta) + '/" target="_blank" rel="noopener" ' +
            'aria-label="' + esc(f.name) + ' auf Instagram">' + INSTA_ICON + "Instagram</a>"
        : "") +
    "</figure>";
  box.innerHTML = [
    ...CONFIG.founders.map(f => karte(f, true)),
    ...CONFIG.founders.map(f => karte(f, false)),
    ...CONFIG.founders.map(f => karte(f, true)),
  ].join("");

  /* ---------- Karussell (nur Handy) ---------- */
  (function karussell() {
    const handy = () => window.matchMedia("(max-width: 559px)").matches;
    const alle = () => [...box.querySelectorAll("figure")];
    const n = CONFIG.founders.length;

    function mitteFinden() {
      const zentrum = box.getBoundingClientRect().left + box.clientWidth / 2;
      let beste = 0, abstand = Infinity;
      alle().forEach((f, i) => {
        const r = f.getBoundingClientRect();
        const d = Math.abs(r.left + r.width / 2 - zentrum);
        if (d < abstand) { abstand = d; beste = i; }
      });
      return beste;
    }
    function markieren() {
      const m = mitteFinden();
      alle().forEach((f, i) => f.classList.toggle("mitte", i === m));
      return m;
    }
    function zentrieren(i, sanft) {
      const f = alle()[i];
      const ziel = f.offsetLeft - (box.clientWidth - f.offsetWidth) / 2;
      box.scrollTo({ left: ziel, behavior: sanft ? "smooth" : "auto" });
    }
    /* Beim Start: der echte Maël in der Mitte. */
    function start() {
      if (!handy()) { alle().forEach(f => f.classList.add("mitte")); return; }
      zentrieren(n, false);
      markieren();
    }
    let ruhe;
    box.addEventListener("scroll", () => {
      if (!handy()) return;
      markieren();
      clearTimeout(ruhe);
      /* Nach dem Wischen: ist man in einer Kopie gelandet, unsichtbar auf
         dieselbe Person im echten Satz springen – so geht es endlos weiter. */
      ruhe = setTimeout(() => {
        const m = mitteFinden();
        if (m < n) zentrieren(m + n, false);
        else if (m >= 2 * n) zentrieren(m - n, false);
        markieren();
      }, 140);
    }, { passive: true });
    window.addEventListener("resize", start);
    requestAnimationFrame(start);
    window.addEventListener("load", start);
  })();

  const suche = {};   /* dieselbe Person liegt dreifach da – nur einmal suchen */
  box.querySelectorAll("figure").forEach(async fig => {
    const kuerzel = fig.dataset.kuerzel;
    const pic = fig.querySelector(".pic");
    const img = fig.querySelector("img");
    const punkte = fig.querySelector(".dots");

    const bilder = await (suche[kuerzel] ||= findeAlle(kuerzel));
    if (!bilder.length) { pic.classList.add("leer"); return; }

    /* Das erste Bild läuft schon; nur nachziehen, falls es anders heisst
       (andere Endung) oder der optimistische Versuch fehlgeschlagen ist. */
    img.alt = fig.querySelector("b").textContent;
    if (!img.getAttribute("src") || !img.getAttribute("src").endsWith(bilder[0])) {
      img.src = bilder[0];
    }

    if (bilder.length < 2) return;          /* ein Bild: nichts zum Blättern */

    fig.classList.add("multi");
    punkte.innerHTML = bilder
      .map((_, i) => '<i class="' + (i === 0 ? "on" : "") + '"></i>').join("");
    const dots = [...punkte.querySelectorAll("i")];

    let i = 0, vorgeladen = false, laeuft = false;
    pic.addEventListener("click", () => {
      if (laeuft) return;
      laeuft = true;

      if (!vorgeladen) {                    /* Rest erst jetzt holen */
        bilder.slice(1).forEach(src => { new Image().src = src; });
        vorgeladen = true;
      }

      i = (i + 1) % bilder.length;
      pic.classList.add("wechselt");

      const naechstes = new Image();
      const zeigen = () => {
        img.src = bilder[i];
        dots.forEach((d, n) => d.classList.toggle("on", n === i));
        requestAnimationFrame(() => {
          pic.classList.remove("wechselt");
          laeuft = false;
        });
      };
      naechstes.onload = naechstes.onerror = () => setTimeout(zeigen, 120);
      naechstes.src = bilder[i];
    });
  });

  /* ---------- Knopf zieht sich rein ---------- */
  const btn = document.getElementById("appLink");
  if (!window.IntersectionObserver) {
    btn.classList.add("in");
  } else {
    new IntersectionObserver((entries, obs) => {
      entries.forEach(e => {
        if (e.isIntersecting) { e.target.classList.add("in"); obs.unobserve(e.target); }
      });
    }, { threshold: .4 }).observe(btn);
  }
})();
</script>

</body>
</html>
