<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <title>Sidequester</title>
    <meta name="theme-color" content="#FFFCF7" />
    <style>
      html, body { height: 100%; margin: 0; background: #FFFCF7;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        color: #6E625D; display: grid; place-items: center; text-align: center; }
      main { padding: 24px; max-width: 340px; }
      img { width: 64px; height: 64px; border-radius: 16px; }
      h1 { font-family: "Arial Black", "Helvetica Neue", Helvetica, sans-serif; font-weight: 900;
        color: #241410; font-size: 22px; margin: 16px 0 8px; }
      p { font-size: 15px; line-height: 22px; margin: 0; }
      a { color: #C42E19; font-weight: 700; }
    </style>
    <!--
      Mail-Links von Supabase (Passwort vergessen, Registrieren, …) laufen
      über diese Seite. So steht in der Mail nur sidequester.ch – Spamfilter
      werten fremde Domains in Passwort-Mails als Phishing-Zeichen.

      Der Schlüssel steht hinter dem #, geht also nie an GitHub. Die Seite
      reicht ihn per JavaScript an Supabase weiter; Link-Scanner ohne
      JavaScript verbrauchen ihn darum auch nicht vorzeitig.

      Erzeugt aus mail-vorlagen/ (siehe EINRICHTEN.md). Nicht löschen,
      sonst führen alle Links in verschickten Mails ins Leere.
    -->
    <script>
      (function () {
        var API = 'https://nfjnylvwsudukokfutex.supabase.co/auth/v1/verify';
        var WEB = 'https://sidequester.ch/game';
        var ZIELE = {
          recovery: WEB + '/passwort-neu',
          signup: WEB + '/',
          email_change: WEB + '/',
          magiclink: WEB + '/',
          invite: WEB + '/passwort-neu'
        };
        // Wer sich in der iPhone-App angemeldet hat (z=app, setzt die Edge
        // Function mail-senden), kommt nach dem Bestätigen zurück in die
        // App – angemeldet, ohne Passwort nochmal einzutippen. Am Computer
        // gibt es die App nicht, dort bleibt es bei der Webversion.
        var APP = {
          recovery: 'sidequester://passwort-neu',
          signup: 'sidequester://',
          email_change: 'sidequester://',
          magiclink: 'sidequester://'
        };
        var p = new URLSearchParams(location.hash.replace(/^#/, ''));
        var t = p.get('t') || '';
        var a = p.get('a') || '';
        if (!/^[A-Za-z0-9_-]{10,200}$/.test(t) || !Object.prototype.hasOwnProperty.call(ZIELE, a)) {
          window.__kaputt = true;
          return;
        }
        var handy = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)
          || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
        var inApp = p.get('z') === 'app' && handy && Object.prototype.hasOwnProperty.call(APP, a);
        window.__inApp = inApp;
        location.replace(API + '?token=' + encodeURIComponent(t) + '&type=' + a
          + '&redirect_to=' + encodeURIComponent(inApp ? APP[a] : ZIELE[a]));
      })();
    </script>
  </head>
  <body>
    <main>
      <img src="/game/apple-touch-icon.png" alt="" />
      <h1 id="titel">Einen Moment …</h1>
      <p id="text">Du wirst zu Sidequester weitergeleitet.</p>
    </main>
    <script>
      // Zurück in die App: Safari fragt «In Sidequester öffnen?» und bleibt
      // auf dieser Seite stehen. Dann wenigstens sagen, dass es geklappt hat.
      if (window.__inApp) {
        setTimeout(function () {
          document.getElementById('titel').textContent = 'Bestätigt';
          document.getElementById('text').innerHTML =
            'Weiter geht es in der App.<br><br><a href="sidequester://">Sidequester öffnen</a>';
        }, 2500);
      }
      if (window.__kaputt) {
        document.getElementById('titel').textContent = 'Link unvollständig';
        document.getElementById('text').innerHTML =
          'Dieser Link ist kaputt oder abgeschnitten. Fordere in der App einfach eine neue Mail an.'
          + '<br><br><a href="/game/login">Zu Sidequester</a>';
      }
    </script>
    <noscript><p>Bitte JavaScript einschalten, damit der Link funktioniert.</p></noscript>
  </body>
</html>
